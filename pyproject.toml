[project]
name = "velero-aks-setup"
version = "0.1.0"
description = "Production-ready Velero on AKS with Workload Identity and ArgoCD"
requires-python = ">=3.11"
dependencies = []  # runtime deps listed in requirements.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length handled by formatter
