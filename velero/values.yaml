# Velero Helm Chart Values
# Configured for AKS with Workload Identity (no storage keys), CSI snapshots, and cost optimisation

image:
  repository: velero/velero
  tag: v1.13.0
  pullPolicy: IfNotPresent

configuration:
  backupStorageLocation:
    - name: default
      provider: azure
      bucket: velero-backups          # replaced by setup-azure.sh
      prefix: backups
      config:
        resourceGroup: <REPLACE_WITH_YOUR_RESOURCE_GROUP>
        storageAccount: <REPLACE_WITH_YOUR_STORAGE_ACCOUNT>
        subscriptionId: <REPLACE_WITH_YOUR_SUBSCRIPTION_ID>
        # Workload Identity — no storageAccountKeyEnvVar needed
        useAAD: "true"

  volumeSnapshotLocation:
    - name: default
      provider: azure
      config:
        resourceGroup: <REPLACE_WITH_YOUR_RESOURCE_GROUP>
        subscriptionId: <REPLACE_WITH_YOUR_SUBSCRIPTION_ID>
        incremental: "true"           # incremental snapshots = lower cost
        apiTimeout: 5m

  defaultBackupTTL: 720h              # 30 days
  defaultVolumeSnapshotLocations: azure:default
  features: EnableCSI
  uploaderType: kopia
  garbageCollectionFrequency: 24h

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

initContainers:
  - name: velero-plugin-for-microsoft-azure
    image: velero/velero-plugin-for-microsoft-azure:v1.9.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

  - name: velero-plugin-for-csi
    image: velero/velero-plugin-for-csi:v0.7.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Workload Identity — no secret needed; credentials come from the federated token
credentials:
  useSecret: false

serviceAccount:
  server:
    create: false                     # created & annotated by setup-azure.sh
    name: velero
    annotations:
      azure.workload.identity/client-id: <REPLACE_WITH_YOUR_CLIENT_ID>

# Pod label required for the Azure Workload Identity webhook to inject the token
podLabels:
  azure.workload.identity/use: "true"

rbac:
  create: true

schedules:
  daily-backup:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
      snapshotVolumes: true
      defaultVolumesToFsBackup: false
      storageLocation: default
      volumeSnapshotLocations:
        - default
      metadata:
        labels:
          backup-type: daily

  weekly-backup:
    disabled: false
    schedule: "0 3 * * 0"
    useOwnerReferencesInBackup: false
    template:
      ttl: 2160h
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
      snapshotVolumes: true
      defaultVolumesToFsBackup: false
      storageLocation: default
      volumeSnapshotLocations:
        - default
      metadata:
        labels:
          backup-type: weekly

# Node agent disabled — snapshots handle PVCs; enable only for volumes without snapshot support
deployNodeAgent: false

nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

metrics:
  enabled: true
  scrapeInterval: 30s
  scrapeTimeout: 10s

  serviceMonitor:
    enabled: false
    additionalLabels:
      release: prometheus

  prometheusRule:
    enabled: false
    additionalLabels:
      release: prometheus
    spec:
      - alert: VeleroBackupPartialFailures
        annotations:
          message: Velero backup {{ $labels.schedule }} has {{ $value | humanizePercentage }} partial failures.
        expr: |-
          velero_backup_partial_failure_total{schedule!=""} / velero_backup_attempt_total{schedule!=""} > 0.25
        for: 15m
        labels:
          severity: warning
      - alert: VeleroBackupFailures
        annotations:
          message: Velero backup {{ $labels.schedule }} has {{ $value | humanizePercentage }} failures.
        expr: |-
          velero_backup_failure_total{schedule!=""} / velero_backup_attempt_total{schedule!=""} > 0.25
        for: 15m
        labels:
          severity: warning

kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: 1.28

snapshotsEnabled: true
backupsEnabled: true
replicas: 1
cleanUpCRDs: false
upgradeCRDs: true

upgradeCRDsJob:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

logLevel: info
logFormat: text

tolerations: []
affinity: {}
nodeSelector: {}

podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

extraVolumes: []
extraVolumeMounts: []
extraEnvVars: {}
podAnnotations: {}
